name: Firmware and Web Installer

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.board }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        board: [xiao_esp32s3, xiao_esp32c3, xiao_esp32c6, xiao_esp32c5]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .github/requirements-build.txt
      - name: Validate version and packaging tests
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          python scripts/release.py version --tag "$RELEASE_TAG"
          python -m unittest discover -s tests -v
      - name: Cache PlatformIO downloads
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ matrix.board }}-${{ hashFiles('platformio.ini', '.github/requirements-build.txt') }}
      - name: Install PlatformIO
        run: python -m pip install -r .github/requirements-build.txt
      - name: Build firmware
        run: pio run -e ${{ matrix.board }}
      - name: Validate and package factory image
        run: python scripts/release.py package --board ${{ matrix.board }}
      - uses: actions/upload-artifact@v7
        with:
          name: firmware-${{ matrix.board }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish release and prepare installer
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          pattern: firmware-*
          path: dist
          merge-multiple: true
      - name: Validate all artifacts and build site
        run: python3 scripts/release.py site
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" dist/* --verify-tag --generate-notes \
              --title "ChainOSCPad MIDI $RELEASE_TAG" --repo "$GITHUB_REPOSITORY"
          fi
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: Deploy Web Installer
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
